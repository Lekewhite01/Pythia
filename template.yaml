AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pythia python backend on Lambda

Resources:
  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'pythia-python-backend'
      Timeout: 600
      CodeUri: app
      AutoPublishAlias: live
      Handler: main.handler
      Runtime: python3.10
      MemorySize: 1024  # Memory size in MB
      EphemeralStorage:
        Size: 5120  # Ephemeral storage size in MB (max 10,240 MB)
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api

  Api:
    Type: AWS::Serverless::HttpApi

Outputs:
  ApiUrl:
    Description: URL of your API
    Value:
      Fn::Sub: 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/'
